<section class="section-stats-strip stats-strip--b" id="estadisticas" aria-label="Estadísticas del consultorio">
  <div class="stats-strip-inner">
    <div class="stats-strip-item reveal">
      <div class="stats-strip-num" data-target="500" data-prefix="+">+500</div>
      <div class="stats-strip-label">Cirugías<br />realizadas</div>
    </div>
    <div class="stats-strip-item reveal reveal-delay-1">
      <div class="stats-strip-num" data-target="15" data-prefix="+">+15</div>

      <div class="stats-strip-num" data-target="120" data-suffix="+">120+</div>
